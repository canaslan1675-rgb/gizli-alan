name: gizlialan
description: >
  GizliAlan — personal Hidden Space vault for Demirhan.
  Privacy-first local notes & files. No spyware, no cloud, no SMS intercept.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  encrypt: ^5.0.3
  intl: ^0.19.0
  path: ^1.9.0
  uuid: ^4.5.1
  # local_auth optional — skipped for MVP; add later if biometrics wanted

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
