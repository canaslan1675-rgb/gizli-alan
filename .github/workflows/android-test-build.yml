# Debug-signed test APKs (play + full, arm64) → GitHub prerelease v<version>-test.
# Signed with the same Android debug key as earlier *-test releases (secret
# DEBUG_KEYSTORE_B64) so they install over them. The Play upload key is NEVER
# used in CI; the Play AAB is built locally on the owner's box.
name: android-test-build

on:
  workflow_dispatch:
  push:
    tags: ['v*-test']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64"
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test ! -e android/key.properties  # must fall back to debug signing
          echo "GIZLI_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:'

      - run: flutter pub get
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --flavor play --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-play-release.apk /tmp/play.apk
          flutter build apk --release --flavor full --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-full-release.apk /tmp/full.apk

      - name: Kotlin unit tests (full flavor)
        run: cd android && ./gradlew --no-daemon -q :app:testFullDebugUnitTest

      - name: Verify signer (must match earlier *-test releases)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in /tmp/play.apk /tmp/full.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/cert.txt
            grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/cert.txt
          done
        env:
          EXPECTED_CERT_SHA256: 090ace425849fcf2a7dae20af382784fe0e721719eec3230fb5a36fb92f5c321

      - name: Publish prerelease
        # Branch runs are build/verify only; releases come from main or tags.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          BUILD=$(sed -n 's/^version: *[0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VER}-test"
          fi
          mkdir -p dist
          cp /tmp/play.apk "dist/GizliAlan-v${VER}-play.apk"
          cp /tmp/full.apk "dist/GizliAlan-v${VER}-full.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          NOTES="Debug-signed arm64 test builds (not for Play), built by GitHub Actions from ${GITHUB_SHA}.
Version ${VER}+${BUILD}. play = no Second phone; full = with Second phone.
Signed with the shared debug key so this full APK updates com.offerforge.gizlialan.full in place. Do not install the v0.4.4-11-test asset; that file uses a different key and the installer reports Uygulama yüklenmedi."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
              --title "GizliAlan ${VER}+${BUILD}" \
              --notes "$NOTES"
          fi
