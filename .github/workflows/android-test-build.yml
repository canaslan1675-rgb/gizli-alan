# Debug-signed test APKs (play + full, arm64) → GitHub prerelease v<version>-test.
# Signed with the same Android debug key as earlier *-test releases (secret
# DEBUG_KEYSTORE_B64) so they install over them. The Play upload key is NEVER
# used in CI; the Play AAB is built locally on the owner's box.
name: android-test-build

on:
  workflow_dispatch:
  push:
    tags: ['v*-test']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64"
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test ! -e android/key.properties  # must fall back to debug signing
          echo "GIZLI_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:'

      - run: flutter pub get
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --flavor play --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-play-release.apk /tmp/play.apk
          flutter build apk --release --flavor full --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-full-release.apk /tmp/full.apk

      - name: Kotlin unit tests (full flavor)
        run: cd android && ./gradlew --no-daemon -q :app:testFullDebugUnitTest

      - name: Verify signer (must match earlier *-test releases)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in /tmp/play.apk /tmp/full.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/cert.txt
            grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/cert.txt
          done
        env:
          EXPECTED_CERT_SHA256: 090ace425849fcf2a7dae20af382784fe0e721719eec3230fb5a36fb92f5c321

      # Play AAB (main only): debug-signed here, uploaded as a short-lived
      # workflow artifact (NOT a release). The owner re-signs it locally with
      # the upload key, which never leaves the owner's box.
      - name: Build Play AAB (debug-signed, for local re-signing)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build appbundle --release --flavor play
          cp build/app/outputs/bundle/playRelease/app-play-release.aab /tmp/app-play-release.aab

      - name: Upload Play AAB artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: play-aab-unsigned-for-upload-key
          path: /tmp/app-play-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Publish prerelease
        # Branch runs are build/verify only; releases come from main or tags.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only commits already on main may publish (a tag pushed on an
          # unreviewed branch must not create or overwrite a release).
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; refusing to publish"; exit 1
          fi
          VER=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          TAG="v${VER}-test"
          mkdir -p dist
          cp /tmp/play.apk "dist/GizliAlan-v${VER}-play.apk"
          cp /tmp/full.apk "dist/GizliAlan-v${VER}-full.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never replace assets of a release built from another commit.
            TARGET=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG belongs to $TARGET, not $GITHUB_SHA; bump the version"; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
              --title "GizliAlan ${TAG}" \
              --notes "Debug-signed arm64 test builds (not for Play), built by GitHub Actions from ${GITHUB_SHA}. play = no Second phone; full = with Second phone. SHA256SUMS.txt attached."
          fi
